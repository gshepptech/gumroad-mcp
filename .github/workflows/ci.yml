name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - run: go build ./...

      # TestPolicyCoversTheInstalledCLI skips when `gumroad` is absent, which it
      # is here. Everything else runs, including the whole tier policy.
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
